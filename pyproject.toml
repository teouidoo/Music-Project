[project]
name = "rightsflow"
version = "0.1.0"
description = "Rights-holder economics for AI-generated music, built on the Eleven Music API"
authors = [{ name = "Thomas Kim", email = "tkim1993@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
eleven = ["elevenlabs"]
dev = ["pytest"]

[project.scripts]
rightsflow = "rightsflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rightsflow"]
